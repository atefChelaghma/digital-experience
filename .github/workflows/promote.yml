name: Promote Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Docker image tag to promote
        required: true
        type: string

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/atefchelaghma/digital-experience

jobs:
  promote-preprod:
    name: Promote to Preprod

    runs-on: ubuntu-24.04

    steps:
      - name: Checkout GitOps repository
        uses: actions/checkout@v7
        with:
          repository: atefChelaghma/pipe-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Validate image tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ ! "${IMAGE_TAG}" =~ ^sha-[a-f0-9]{7}$ ]]; then
            echo "Invalid image tag: ${IMAGE_TAG}"
            echo "Expected format: sha-1234567"
            exit 1
          fi

          echo "Promoting: ${IMAGE_NAME}:${IMAGE_TAG}"

            - name: Verify image exists
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          docker manifest inspect \
            "${IMAGE_NAME}:${IMAGE_TAG}" > /dev/null

          echo "Image exists in GHCR."

      - name: Update Preprod image
        working-directory: gitops
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -e

          FILE="k8s/overlays/preprod/kustomization.yaml"

          echo "IMAGE_TAG=${IMAGE_TAG}"
          echo ""
          echo "Before:"
          cat "${FILE}"

          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("k8s/overlays/preprod/kustomization.yaml")
          new_tag = os.environ["IMAGE_TAG"]

          lines = path.read_text().splitlines()

          inside_images = False
          target_image = False
          updated = False

          for i, line in enumerate(lines):
              stripped = line.strip()

              if stripped == "images:":
                  inside_images = True
                  continue

              if inside_images and stripped.startswith("- name:"):
                  target_image = stripped == "- name: my-website"
                  continue

              if inside_images and target_image and stripped.startswith("newTag:"):
                  indent = line[:len(line) - len(line.lstrip())]
                  lines[i] = f"{indent}newTag: {new_tag}"
                  updated = True
                  break

          if not updated:
              raise SystemExit(
                  "ERROR: Could not find newTag for image 'my-website'"
              )

          path.write_text("\n".join(lines) + "\n")
          PY

          echo ""
          echo "After:"
          cat "${FILE}"

          echo ""
          echo "Diff:"
          git diff -- "${FILE}"

      - name: Validate Preprod manifest
        working-directory: gitops
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          EXPECTED="${IMAGE_NAME}:${IMAGE_TAG}"

          echo "Expected image:"
          echo "${EXPECTED}"

          echo ""
          echo "Rendered image:"

          kustomize build k8s/overlays/preprod |
            grep "image:"

          echo ""
          echo "Checking image..."

          kustomize build k8s/overlays/preprod |
            grep -q "image: ${EXPECTED}"

          echo "Preprod manifest validation passed."

      - name: Commit and push
        working-directory: gitops
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/overlays/preprod/kustomization.yaml

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git diff --cached

          git commit \
            -m "chore: promote ${IMAGE_TAG} to preprod"

          git push origin main
