name: Promote to Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker SHA tag currently deployed to Preprod (example: sha-000f5af)'
        required: true
        type: string

permissions:
  contents: read
  packages: read

env:
  IMAGE_NAME: ghcr.io/atefchelaghma/digital-experience
  GITOPS_REPO: atefChelaghma/pipe-gitops
  GITOPS_BRANCH: main
  PREPROD_FILE: k8s/overlays/preprod/kustomization.yaml
  PRODUCTION_FILE: k8s/overlays/production/kustomization.yaml

jobs:
  promote-production:
    name: Promote Preprod image to Production
    runs-on: ubuntu-24.04

    steps:
      # ============================================================
      # 1. Validate input
      # ============================================================

      - name: Validate image tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -e

          echo "=========================================="
          echo "Validating image tag"
          echo "=========================================="
          echo ""

          echo "Image tag:"
          echo "${IMAGE_TAG}"

          if [[ ! "${IMAGE_TAG}" =~ ^sha-[a-f0-9]{7}$ ]]; then
            echo ""
            echo "ERROR: Invalid image tag."
            echo ""
            echo "Expected format:"
            echo "sha-XXXXXXX"
            echo ""
            echo "Example:"
            echo "sha-000f5af"
            exit 1
          fi

          echo ""
          echo "Image tag format is valid."

      # ============================================================
      # 2. Checkout GitOps repository
      # ============================================================

      - name: Checkout GitOps repository
        uses: actions/checkout@v5
        with:
          repository: ${{ env.GITOPS_REPO }}
          ref: ${{ env.GITOPS_BRANCH }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops
          fetch-depth: 0

      # ============================================================
      # 3. Show current GitOps state
      # ============================================================

      - name: Show current GitOps state
        working-directory: gitops
        run: |
          set -e

          echo "=========================================="
          echo "Current GitOps state"
          echo "=========================================="
          echo ""

          echo "----- PREPROD -----"
          cat "${PREPROD_FILE}"

          echo ""
          echo "----- PRODUCTION -----"
          cat "${PRODUCTION_FILE}"

          echo ""
          echo "----- PREPROD RENDERED IMAGE -----"

          kustomize build k8s/overlays/preprod |
            grep "image:" || true

          echo ""
          echo "----- PRODUCTION RENDERED IMAGE -----"

          kustomize build k8s/overlays/production |
            grep "image:" || true

      # ============================================================
      # 4. Verify Preprod contains requested SHA
      # ============================================================

      - name: Verify Preprod image
        working-directory: gitops
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -e

          EXPECTED="${IMAGE_NAME}:${IMAGE_TAG}"

          echo "=========================================="
          echo "Verifying Preprod image"
          echo "=========================================="
          echo ""

          echo "Expected:"
          echo "${EXPECTED}"

          echo ""
          echo "Preprod rendered image:"

          kustomize build k8s/overlays/preprod |
            grep "image:"

          echo ""
          echo "Checking..."

          if ! kustomize build k8s/overlays/preprod |
              grep -Fq "image: ${EXPECTED}"; then

            echo ""
            echo "ERROR: Preprod does not contain the requested image."
            echo ""
            echo "Requested:"
            echo "${EXPECTED}"
            echo ""
            echo "Preprod currently contains:"
            kustomize build k8s/overlays/preprod |
              grep "image:" || true

            exit 1
          fi

          echo ""
          echo "Preprod image verification PASSED."

      # ============================================================
      # 5. Verify image exists in GHCR
      # ============================================================

      - name: Verify image exists in GHCR
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -e

          IMAGE="${IMAGE_NAME}:${IMAGE_TAG}"

          echo "=========================================="
          echo "Verifying GHCR image"
          echo "=========================================="
          echo ""

          echo "Image:"
          echo "${IMAGE}"

          docker manifest inspect "${IMAGE}" > /dev/null

          echo ""
          echo "GHCR image exists."

      # ============================================================
      # 6. Update Production image
      # ============================================================

      - name: Update Production image
        working-directory: gitops
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -e

          FILE="${PRODUCTION_FILE}"
          TARGET_IMAGE="${IMAGE_NAME}"

          echo "=========================================="
          echo "Updating Production image"
          echo "=========================================="
          echo ""

          echo "Target image:"
          echo "${TARGET_IMAGE}"

          echo "Target tag:"
          echo "${IMAGE_TAG}"

          echo ""
          echo "File:"
          echo "${FILE}"

          echo ""
          echo "------------------------------------------"
          echo "BEFORE"
          echo "------------------------------------------"

          cat "${FILE}"

          echo ""
          echo "------------------------------------------"
          echo "Updating newTag"
          echo "------------------------------------------"

          python3 - "${FILE}" "${TARGET_IMAGE}" "${IMAGE_TAG}" <<'PY'
          import sys
          from pathlib import Path

          file_path = Path(sys.argv[1])
          target_image = sys.argv[2]
          new_tag = sys.argv[3]

          lines = file_path.read_text().splitlines()

          target_line = f"- name: {target_image}"

          image_index = None
          tag_index = None

          # Find exact image
          for index, line in enumerate(lines):
              if line.strip() == target_line:
                  image_index = index
                  break

          if image_index is None:
              print("")
              print("ERROR: Target image was not found.")
              print("")
              print(f"Looking for:")
              print(f"  {target_line}")
              print("")
              sys.exit(1)

          print(f"Found target image at line {image_index + 1}")

          # Find newTag belonging to this image
          for index in range(image_index + 1, len(lines)):

              stripped = lines[index].strip()

              # Stop if another image starts
              if stripped.startswith("- name:"):
                  break

              if stripped.startswith("newTag:"):
                  tag_index = index
                  break

          if tag_index is None:
              print("")
              print("ERROR: newTag was not found.")
              print("")
              sys.exit(1)

          old_tag = lines[tag_index].split(":", 1)[1].strip()

          indent = lines[tag_index][
              :len(lines[tag_index]) - len(lines[tag_index].lstrip())
          ]

          print(f"Current tag: {old_tag}")
          print(f"New tag:     {new_tag}")

          lines[tag_index] = f"{indent}newTag: {new_tag}"

          file_path.write_text(
              "\n".join(lines) + "\n"
          )

          print("")
          print("Successfully updated Production image tag.")
          PY

          echo ""
          echo "------------------------------------------"
          echo "AFTER"
          echo "------------------------------------------"

          cat "${FILE}"

          echo ""
          echo "------------------------------------------"
          echo "GIT DIFF"
          echo "------------------------------------------"

          git diff -- "${FILE}"

      # ============================================================
      # 7. Validate Production manifest
      # ============================================================

      - name: Validate Production manifest
        working-directory: gitops
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -e

          EXPECTED="${IMAGE_NAME}:${IMAGE_TAG}"

          echo "=========================================="
          echo "Validating Production manifest"
          echo "=========================================="
          echo ""

          echo "Expected image:"
          echo "${EXPECTED}"

          echo ""
          echo "Rendered images:"
          echo "------------------------------------------"

          RENDERED="$(kustomize build k8s/overlays/production)"

          echo "${RENDERED}" | grep "image:"

          echo ""
          echo "------------------------------------------"
          echo "Checking expected image"
          echo "------------------------------------------"

          if ! echo "${RENDERED}" |
              grep -Fq "image: ${EXPECTED}"; then

            echo ""
            echo "ERROR: Expected image was NOT found."
            echo ""
            echo "Expected:"
            echo "${EXPECTED}"
            echo ""
            echo "Rendered:"
            echo "${RENDERED}" |
              grep "image:" || true

            exit 1
          fi

          echo ""
          echo "Production manifest validation PASSED."

      # ============================================================
      # 8. Validate Production has 3 replicas
      # ============================================================

      - name: Validate Production replicas
        working-directory: gitops
        run: |
          set -e

          echo "=========================================="
          echo "Validating Production replicas"
          echo "=========================================="
          echo ""

          RENDERED="$(kustomize build k8s/overlays/production)"

          echo "${RENDERED}" |
            grep -A5 -B2 "kind: Deployment"

          echo ""

          if ! echo "${RENDERED}" |
              grep -A10 "name: my-website" |
              grep -q "replicas: 3"; then

            echo "ERROR: Production deployment does not have 3 replicas."
            exit 1
          fi

          echo "Production replica validation PASSED."

      # ============================================================
      # 9. Show final diff
      # ============================================================

      - name: Show final GitOps diff
        working-directory: gitops
        run: |
          set -e

          echo "=========================================="
          echo "Final GitOps diff"
          echo "=========================================="
          echo ""

          git diff -- "${PRODUCTION_FILE}"

      # ============================================================
      # 10. Commit and push
      # ============================================================

      - name: Commit and push Production promotion
        working-directory: gitops
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -e

          echo "=========================================="
          echo "Committing Production promotion"
          echo "=========================================="

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "${PRODUCTION_FILE}"

          if git diff --cached --quiet; then
            echo ""
            echo "No Production changes detected."
            exit 0
          fi

          git commit \
            -m "chore(production): promote ${IMAGE_TAG}"

          git push origin "${GITOPS_BRANCH}"

          echo ""
          echo "=========================================="
          echo "Production promotion completed"
          echo "=========================================="
          echo ""

          echo "Promoted image:"
          echo "${IMAGE_NAME}:${IMAGE_TAG}"
