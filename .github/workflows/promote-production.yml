name: Promote to Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker SHA tag currently deployed to Preprod (example: sha-000f5af)'
        required: true
        type: string

permissions:
  contents: read
  packages: read

env:
  IMAGE_NAME: ghcr.io/atefchelaghma/digital-experience
  GITOPS_REPO: atefChelaghma/pipe-gitops
  GITOPS_BRANCH: main
  PREPROD_FILE: k8s/overlays/preprod/kustomization.yaml
  PRODUCTION_FILE: k8s/overlays/production/kustomization.yaml

jobs:
  # ================================================================
  # 1. Validate promotion
  # ================================================================

  validate:
    name: Validate Production Promotion
    runs-on: ubuntu-24.04

    steps:
      # ------------------------------------------------------------
      # Validate SHA format
      # ------------------------------------------------------------

      - name: Validate image tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -e

          echo "=========================================="
          echo "Validating image tag"
          echo "=========================================="
          echo ""

          echo "Image tag:"
          echo "${IMAGE_TAG}"

          if [[ ! "${IMAGE_TAG}" =~ ^sha-[a-f0-9]{7}$ ]]; then
            echo ""
            echo "ERROR: Invalid image tag."
            echo ""
            echo "Expected:"
            echo "sha-XXXXXXX"
            echo ""
            echo "Example:"
            echo "sha-000f5af"

            exit 1
          fi

          echo ""
          echo "Image tag format is valid."

      # ------------------------------------------------------------
      # Checkout GitOps repository
      # ------------------------------------------------------------

      - name: Checkout GitOps repository
        uses: actions/checkout@v5
        with:
          repository: ${{ env.GITOPS_REPO }}
          ref: ${{ env.GITOPS_BRANCH }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops
          fetch-depth: 0

      # ------------------------------------------------------------
      # Show GitOps state
      # ------------------------------------------------------------

      - name: Show GitOps state
        working-directory: gitops
        run: |
          set -e

          echo "=========================================="
          echo "GitOps state"
          echo "=========================================="

          echo ""
          echo "----- PREPROD -----"

          cat "${PREPROD_FILE}"

          echo ""
          echo "----- PRODUCTION -----"

          cat "${PRODUCTION_FILE}"

      # ------------------------------------------------------------
      # Verify Preprod uses requested SHA
      # ------------------------------------------------------------

      - name: Verify Preprod image
        working-directory: gitops
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -e

          EXPECTED="${IMAGE_NAME}:${IMAGE_TAG}"

          echo "=========================================="
          echo "Verifying Preprod"
          echo "=========================================="

          echo ""
          echo "Expected:"
          echo "${EXPECTED}"

          echo ""
          echo "Rendered Preprod image:"

          kustomize build k8s/overlays/preprod |
            grep "image:"

          echo ""
          echo "Checking..."

          if ! kustomize build k8s/overlays/preprod |
              grep -Fq "image: ${EXPECTED}"; then

            echo ""
            echo "ERROR: Preprod does not contain requested image."

            echo ""
            echo "Requested:"
            echo "${EXPECTED}"

            echo ""
            echo "Current Preprod image:"

            kustomize build k8s/overlays/preprod |
              grep "image:" || true

            exit 1
          fi

          echo ""
          echo "Preprod verification PASSED."

      # ------------------------------------------------------------
      # Verify GHCR image
      # ------------------------------------------------------------

      - name: Verify image exists in GHCR
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -e

          IMAGE="${IMAGE_NAME}:${IMAGE_TAG}"

          echo "=========================================="
          echo "Verifying GHCR image"
          echo "=========================================="

          echo ""
          echo "Image:"
          echo "${IMAGE}"

          docker manifest inspect "${IMAGE}" > /dev/null

          echo ""
          echo "GHCR image exists."

  # ================================================================
  # 2. Production deployment
  #
  # IMPORTANT:
  #
  # The "production" environment is protected by GitHub.
  #
  # GitHub will pause this job until an authorized reviewer
  # approves the deployment.
  # ================================================================

  deploy:
    name: Deploy to Production

    needs:
      - validate

    runs-on: ubuntu-24.04

    environment:
      name: production

    steps:
      # ------------------------------------------------------------
      # Checkout GitOps
      # ------------------------------------------------------------

      - name: Checkout GitOps repository
        uses: actions/checkout@v5
        with:
          repository: ${{ env.GITOPS_REPO }}
          ref: ${{ env.GITOPS_BRANCH }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops
          fetch-depth: 0

      # ------------------------------------------------------------
      # Update Production image
      # ------------------------------------------------------------

      - name: Update Production image
        working-directory: gitops
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -e

          FILE="${PRODUCTION_FILE}"

          echo "=========================================="
          echo "Updating Production image"
          echo "=========================================="

          echo ""
          echo "Target:"
          echo "${IMAGE_NAME}:${IMAGE_TAG}"

          echo ""
          echo "File:"
          echo "${FILE}"

          echo ""
          echo "------------------------------------------"
          echo "BEFORE"
          echo "------------------------------------------"

          cat "${FILE}"

          echo ""
          echo "------------------------------------------"
          echo "Running Kustomize"
          echo "------------------------------------------"

          kustomize edit set image \
            "${IMAGE_NAME}=${IMAGE_NAME}:${IMAGE_TAG}"

          echo ""
          echo "------------------------------------------"
          echo "AFTER"
          echo "------------------------------------------"

          cat "${FILE}"

          echo ""
          echo "------------------------------------------"
          echo "GIT DIFF"
          echo "------------------------------------------"

          git diff -- "${FILE}"
      # ------------------------------------------------------------
      # Validate Production manifest
      # ------------------------------------------------------------

      - name: Validate Production manifest
        working-directory: gitops
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -e

          EXPECTED="${IMAGE_NAME}:${IMAGE_TAG}"

          echo "=========================================="
          echo "Validating Production manifest"
          echo "=========================================="

          echo ""
          echo "Expected:"
          echo "${EXPECTED}"

          echo ""
          echo "Rendered image:"

          RENDERED="$(
            kustomize build k8s/overlays/production
          )"

          echo "${RENDERED}" | grep "image:"

          echo ""
          echo "Checking..."

          if ! echo "${RENDERED}" |
              grep -Fq "image: ${EXPECTED}"; then

            echo ""
            echo "ERROR: Expected image was not found."

            echo ""
            echo "Expected:"
            echo "${EXPECTED}"

            echo ""
            echo "Rendered:"
            echo "${RENDERED}" |
              grep "image:" || true

            exit 1
          fi

          echo ""
          echo "Production image validation PASSED."

      # ------------------------------------------------------------
      # Validate replicas
      # ------------------------------------------------------------

      - name: Validate Production replicas
        working-directory: gitops
        run: |
          set -e

          echo "=========================================="
          echo "Validating Production replicas"
          echo "=========================================="

          RENDERED="$(
            kustomize build k8s/overlays/production
          )"

          echo "${RENDERED}" |
            grep -A10 "name: my-website"

          echo ""

          if ! echo "${RENDERED}" |
              grep -q "replicas: 3"; then

            echo ""
            echo "ERROR: Production does not have 3 replicas."

            exit 1
          fi

          echo ""
          echo "Production replica validation PASSED."

      # ------------------------------------------------------------
      # Commit and push GitOps
      # ------------------------------------------------------------

      - name: Commit and push Production promotion
        working-directory: gitops
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -e

          echo "=========================================="
          echo "Committing Production promotion"
          echo "=========================================="

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add "${PRODUCTION_FILE}"

          if git diff --cached --quiet; then

            echo ""
            echo "No Production changes detected."

            exit 0
          fi

          git commit \
            -m "chore(production): promote ${IMAGE_TAG}"

          git push origin "${GITOPS_BRANCH}"

          echo ""
          echo "=========================================="
          echo "Production promotion completed"
          echo "=========================================="

          echo ""
          echo "Promoted image:"
          echo "${IMAGE_NAME}:${IMAGE_TAG}"
