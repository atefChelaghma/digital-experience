name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'test/**'
      - 'feat/**'

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  packages: write

env:
  NODE_VERSION: 22
  IMAGE_NAME: atefchelaghma/digital-experience

jobs:
  validate:
    name: Validate application

    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test -- --ci

      - name: Build application
        run: npm run build

  e2e:
    name: E2E tests

    runs-on: ubuntu-24.04

    needs:
      - validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run E2E tests
        run: npm run test:e2e

  docker-build:
    name: Build ${{ matrix.platform }}

    runs-on: ${{ matrix.runner }}

    needs:
      - validate
      - e2e

    if: github.event_name == 'push'

    strategy:
      fail-fast: false

      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04

          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Set platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}

          labels: ${{ steps.meta.outputs.labels }}

          outputs: >-
            type=image,
            name=ghcr.io/${{ env.IMAGE_NAME }},
            push-by-digest=true,
            name-canonical=true,
            push=true

          cache-from: type=gha,scope=build-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=build-${{ env.PLATFORM_PAIR }}

      - name: Export image digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"

          digest="${{ steps.build.outputs.digest }}"

          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-merge:
    name: Merge multi-platform image

    runs-on: ubuntu-24.04

    needs:
      - docker-build

    if: github.event_name == 'push'

    outputs:
      image: ${{ steps.inspect.outputs.image }}
      tag: ${{ steps.meta.outputs.version }}
      digest: ${{ steps.inspect.outputs.digest }}

    steps:
      - name: Download image digests
        uses: actions/download-artifact@v5
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract final Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create multi-platform manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect final image
        id: inspect
        run: |
          IMAGE="ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"

          docker buildx imagetools inspect "$IMAGE"

          DIGEST=$(docker buildx imagetools inspect "$IMAGE" \
            --format '{{json .Manifest.Digest}}')

          echo "IMAGE=$IMAGE"
          echo "DIGEST=$DIGEST"

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Show final image
        run: |
          echo "Image: ${{ steps.inspect.outputs.image }}"
          echo "Tag: ${{ steps.meta.outputs.version }}"
          echo "Digest: ${{ steps.inspect.outputs.digest }}"

  update-gitops:
    name: Update GitOps Dev

    runs-on: ubuntu-24.04

    needs:
      - docker-merge

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout GitOps repository
        uses: actions/checkout@v7
        with:
          repository: atefChelaghma/pipe-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Update Dev image
        working-directory: gitops
        env:
          IMAGE_TAG: ${{ needs.docker-merge.outputs.tag }}
        run: |
          echo "Updating Dev to ${IMAGE_TAG}"

          sed -i "s/newTag: .*/newTag: ${IMAGE_TAG}/" \
            k8s/overlays/dev/kustomization.yaml

      - name: Validate Dev manifest
        working-directory: gitops
        env:
          IMAGE_TAG: ${{ needs.docker-merge.outputs.tag }}
        run: |
          kubectl kustomize k8s/overlays/dev > /tmp/dev-manifest.yaml

          grep \
            "image: ghcr.io/atefchelaghma/digital-experience:${IMAGE_TAG}" \
            /tmp/dev-manifest.yaml

      - name: Commit and push GitOps change
        working-directory: gitops
        env:
          IMAGE_TAG: ${{ needs.docker-merge.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/overlays/dev/kustomization.yaml

          if git diff --cached --quiet; then
            echo "No GitOps changes."
            exit 0
          fi

          git commit -m "chore: deploy ${IMAGE_TAG} to dev"
          git push origin main
